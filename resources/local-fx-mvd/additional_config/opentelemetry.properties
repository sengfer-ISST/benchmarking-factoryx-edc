# OpenTelemetry java-agent config for the EDC runtimes (Stage 2).
#
# The EDC Dockerfile already starts the JVM with
#   -javaagent:/app/opentelemetry-javaagent.jar
#   -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
# but the agent is inert until this file is mounted at that path (done per
# service in docker-compose.monitoring.yaml). No image rebuild is needed.
#
# Exports go to the otel-collector over OTLP/gRPC on the shared fx-test-network.
# service.name is NOT set here on purpose — it is provided per container via the
# OTEL_SERVICE_NAME env var so each runtime is distinguishable in metrics/traces.

# Send traces + metrics to the collector; logs stay on stdout (docker logs).
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=none

# OTLP/gRPC endpoint — resolved by Docker DNS on fx-test-network.
otel.exporter.otlp.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc

# Push metrics every 5 s to match prometheus.yml scrape_interval, so the
# collector always has fresh samples when Prometheus scrapes it.
otel.metric.export.interval=5000

# Capture the HTTP server route as a span/metric attribute — this is what gives
# us per-endpoint (not just per-service) latency and throughput.
otel.instrumentation.http.server.emit-experimental-telemetry=true

# Emit JVM runtime metrics (heap, GC, threads) so latency spikes can be
# correlated with GC pauses without a separate exporter.
otel.instrumentation.runtime-telemetry.enabled=true
