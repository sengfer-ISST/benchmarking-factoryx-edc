# IDENTITY OFF (benchmarking G2) parity deployment for Factory-X EDC.
#
# Counterpart to docker-compose.monitoring.yaml (the identity-ON / DCP stack +
# monitoring). The varied factor is the control-plane identity layer: the control
# planes run the fx-mock-identity image
#       edc-controlplane-postgresql-hashicorp-vault-fxmock:latest
# which provides the connector's OWN in-process mock identity (MockVcIdentityService +
# local-signing SecureTokenService + DidPublicKeyResolver + AudienceResolver) instead
# of DCP — see edc-extensions/fx-mock-identity/PLAN.md. The whole DCP identity
# infrastructure is dropped: local-issuer-service and both Identity Hubs. Postgres,
# Vault, the data planes, and the entire monitoring stack are unchanged so identity is
# the only varied factor. fx-policy stays in force (the mock injects a
# MembershipCredential), so policy cost is held constant vs. the ON arm.
#
# PREREQUISITE: build the fxmock control-plane image first:
#   ./gradlew :edc-controlplane:edc-controlplane-postgresql-hashicorp-vault-fxmock:dockerize
#
# Run:  docker compose -f docker-compose-fxmock.monitoring.yaml up -d
# Drive: same shared harness + config/factoryx.json as the ON arm:
#   k6 run -e CONNECTOR=factoryx -e IDENTITY_MODE=off scenarios/smoke.js

services:
  shared-postgres:
    container_name: shared-postgres
    image: postgres:16.4-alpine
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    volumes:
      - ./additional_config/pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h 127.0.0.1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - fx-test-network

  shared-vault:
    container_name: shared-vault
    image: vault:1.13.3
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 512M
    command: server -dev -dev-root-token-id=vaultsecret0123456789 -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      SKIP_SETCAP: "true"
      SKIP_CHOWN: "true"
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 4s
      timeout: 3s
      retries: 20
    ports:
      - "8200:8200"
    networks:
      - fx-test-network

  vault-init:
    container_name: vault-init
    image: alpine:3.19
    pull_policy: never
    depends_on:
      shared-vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://shared-vault:8200
      VAULT_TOKEN: vaultsecret0123456789
    volumes:
      - ./additional_config/vault-init.sh:/scripts/init.sh:ro
    entrypoint: [
      "sh", "-c",
      "apk add --no-check-certificate --no-cache curl jq openssl && tr -d '\r' < /scripts/init.sh > /tmp/init.sh && sh /tmp/init.sh"
    ]
    restart: "no"
    networks:
      - fx-test-network

  consumer-controlplane:
    container_name: consumer-controlplane
    image: edc-controlplane-postgresql-hashicorp-vault-fxmock:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      # --- DCP/STS/Identity-Hub env removed; fx-mock-identity supplies identity. ---
      - edc.iam.did.web.use.https=false
      - edc.iam.issuer.id=did:web:consumer-idhub:user:consumer
      - web.http.port=9000
      - web.http.path=/api
      - web.http.management.port=9010
      - web.http.management.path=/management
      - web.http.protocol.port=9020
      - web.http.protocol.path=/dsp
      - web.http.validation.port=9030
      - web.http.validation.path=/validation
      - web.http.control.port=9050
      - web.http.control.path=/control
      - edc.hostname=consumer-controlplane
      - edc.participant.id=did:web:consumer-idhub:user:consumer
      - edc.dsp.callback.address=http://consumer-controlplane:9020/dsp
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/cons_cpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
      - OTEL_SERVICE_NAME=consumer-controlplane
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=fx-mock,service.instance.id=consumer-controlplane
    volumes:
      - ./additional_config/logging.properties:/app/dataspaceconnector-configuration.properties
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    healthcheck:
      # Readiness gates the data plane self-registration: the DP POST to
      # /control/v1/dataplanes 405s until the control API is mounted, so the data
      # planes depend_on this (avoids the "No dataplane found" startup race).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/api/check/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "29000:9000"
      - "29010:9010"
      - "29020:9020"
    networks:
      - fx-test-network

  consumer-dataplane:
    container_name: consumer-dataplane
    image: edc-dataplane-hashicorp-vault:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - web.http.public.port=9500
      - web.http.public.path=/public
      - web.http.management.port=9510
      - web.http.management.path=/management
      - web.http.control.port=9550
      - web.http.control.path=/control
      - edc.hostname=consumer-dataplane
      - edc.dpf.selector.url=http://consumer-controlplane:9050/control/v1/dataplanes
      - edc.data.plane.self.unregistration=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/cons_dpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.transfer.proxy.token.signer.privatekey.alias=cons_priv
      - edc.transfer.proxy.token.verifier.publickey.alias=cons_pub
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
      # IDENTITY OFF: the TX data-plane token-refresh validates a DID + STS oauth config
      # at boot. There is no Identity Hub in this arm, so these are DUMMY/unused values
      # (a present-but-unreachable token URL + an existing vault key as the secret alias):
      # a single consumer-pull never calls STS — the EDR is validated via the
      # transfer-proxy key (cons_priv/cons_pub), not via STS.
      - edc.iam.did.web.use.https=false
      - edc.iam.issuer.id=did:web:consumer-idhub:user:consumer
      - edc.iam.sts.oauth.token.url=http://localhost:9999/sts/token
      - edc.iam.sts.oauth.client.id=did:web:consumer-idhub:user:consumer
      - edc.iam.sts.oauth.client.secret.alias=cons_priv
      - OTEL_SERVICE_NAME=consumer-dataplane
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=fx-mock,service.instance.id=consumer-dataplane
    volumes:
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
      consumer-controlplane:
        condition: service_healthy   # register only after the control API is up (no 405 race)
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "9600:9500"
    networks:
      - fx-test-network

  provider-controlplane:
    container_name: provider-controlplane
    image: edc-controlplane-postgresql-hashicorp-vault-fxmock:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      # --- DCP/STS/Identity-Hub env removed; fx-mock-identity supplies identity. ---
      - edc.iam.did.web.use.https=false
      - edc.iam.issuer.id=did:web:provider-idhub:user:provider
      - web.http.port=9000
      - web.http.path=/api
      - web.http.management.port=9010
      - web.http.management.path=/management
      - web.http.protocol.port=9020
      - web.http.protocol.path=/dsp
      - web.http.validation.port=9030
      - web.http.validation.path=/validation
      - web.http.control.port=9050
      - web.http.control.path=/control
      - edc.hostname=provider-controlplane
      - edc.participant.id=did:web:provider-idhub:user:provider
      - edc.dsp.callback.address=http://provider-controlplane:9020/dsp
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/prov_cpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
      - OTEL_SERVICE_NAME=provider-controlplane
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=fx-mock,service.instance.id=provider-controlplane
    volumes:
      - ./additional_config/logging.properties:/app/dataspaceconnector-configuration.properties
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    healthcheck:
      # Readiness gates the data plane self-registration (see consumer-controlplane).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/api/check/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "39000:9000"
      - "39010:9010"
      - "39020:9020"
    networks:
      - fx-test-network

  provider-dataplane:
    container_name: provider-dataplane
    image: edc-dataplane-hashicorp-vault:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - web.http.public.port=9500
      - web.http.public.path=/public
      - web.http.management.port=9510
      - web.http.management.path=/management
      - web.http.control.port=9550
      - web.http.control.path=/control
      - edc.hostname=provider-dataplane
      - edc.dpf.selector.url=http://provider-controlplane:9050/control/v1/dataplanes
      - edc.data.plane.self.unregistration=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/prov_dpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.transfer.proxy.token.signer.privatekey.alias=prov_priv
      - edc.transfer.proxy.token.verifier.publickey.alias=prov_pub
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
      # IDENTITY OFF: dummy/unused STS oauth config so the TX token-refresh boots (no
      # Identity Hub in this arm). A single consumer-pull never calls STS — the EDR is
      # validated via the transfer-proxy key (prov_priv/prov_pub), not via STS.
      - edc.iam.did.web.use.https=false
      - edc.iam.issuer.id=did:web:provider-idhub:user:provider
      - edc.iam.sts.oauth.token.url=http://localhost:9999/sts/token
      - edc.iam.sts.oauth.client.id=did:web:provider-idhub:user:provider
      - edc.iam.sts.oauth.client.secret.alias=prov_priv
      - OTEL_SERVICE_NAME=provider-dataplane
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=fx-mock,service.instance.id=provider-dataplane
    volumes:
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
      provider-controlplane:
        condition: service_healthy   # register only after the control API is up (no 405 race)
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "9500:9500"
    networks:
      - fx-test-network
    # Payload-sweep source must resolve from inside the data plane — see the ON arm.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # Monitoring stack — identical to the ON arm so metrics are comparable.
  # ---------------------------------------------------------------------------
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.108.0
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "8889:8889"
    networks:
      - fx-test-network
    restart: unless-stopped

  tempo:
    container_name: tempo
    image: grafana/tempo:2.6.0
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - fx-test-network
    restart: unless-stopped

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - fx-test-network
    restart: unless-stopped

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      # Accept k6's metric stream (--out experimental-prometheus-rw). Without this the
      # ONLY record of transaction success/failure is k6's end-of-run summary, so no
      # dashboard can show a workflow failure while it is happening.
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
      - otel-collector
    networks:
      - fx-test-network
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Server-side PNG rendering for orchestration/export-panels.sh — turns the
      # per-arm screenshot chore into one command. Without these the /render
      # endpoint returns "Image renderer plugin not found".
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_LOG_FILTERS=rendering:debug
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - fx-test-network
    restart: unless-stopped

  # Headless Chromium that renders dashboard panels to PNG. Only ever called by
  # Grafana itself, so it is not published on the host.
  grafana-renderer:
    container_name: grafana-renderer
    image: grafana/grafana-image-renderer:3.11.6
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - ENABLE_METRICS=false
      - RENDERING_MODE=default
    networks:
      - fx-test-network
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:

networks:
  fx-test-network:
    name: fx-test-network
    driver: bridge
