services:
  local-issuer-service:
    container_name: local-issuer-service
    image: issuerservice-dev:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    ports:
      - "10000:80"        # did API           -> /
      - "10100:15151"     # identity API      -> /api/identity
      - "10200:15152"     # issueradmin API   -> /api/issuer
    #      - "9292:9292"      # sts API           -> /api/sts
    #      - "8181:8181"      # default API       -> /api
    #      - "9999:9999"      # statuslist API    -> /statuslist
    #      - "13132:13132"    # issuance API      -> /api/issuance

    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
      - edc.statuslist.callback.address=http://local-issuer-service:9999/statuslist
      - edc.hostname=local-issuer-service
      - edc.ih.issuer.dev.defaultconfig=/app/setup.json
      - edc.issuer.issuance.send.retry.limit=0
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - edc.issuer.statuslist.signing.key.alias=foo
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/iss_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/mc-cred-def.json:/app/setup.json
      - ./additional_config/logging.properties:/app/logging.properties
    networks:
      - fx-test-network

  shared-postgres:
    container_name: shared-postgres
    image: postgres:16.4-alpine
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    volumes:
      - ./additional_config/pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h 127.0.0.1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - fx-test-network

  shared-vault:
    container_name: shared-vault
    image: vault:1.13.3
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 512M
    command: server -dev -dev-root-token-id=vaultsecret0123456789 -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      SKIP_SETCAP: "true"
      SKIP_CHOWN: "true"
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 4s
      timeout: 3s
      retries: 20
    ports:
      - "8200:8200"
    networks:
      - fx-test-network

  vault-init:
    container_name: vault-init
    image: alpine:3.19
    pull_policy: never
    depends_on:
      shared-vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://shared-vault:8200
      VAULT_TOKEN: vaultsecret0123456789
    volumes:
      - ./additional_config/vault-init.sh:/scripts/init.sh:ro

    entrypoint: [
      "sh", "-c",
      "apk add --no-check-certificate --no-cache curl jq openssl \
       && tr -d '\r' < /scripts/init.sh > /tmp/init.sh \
       && sh /tmp/init.sh"
    ]
    restart: "no"
    networks:
      - fx-test-network

  consumer-idhub:
    container_name: consumer-idhub
    image: identityhub-dev:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    ports:
      - "20000:80"          # did API           -> /
      - "20100:15151"       # identity API      -> /api/identity
      - "20500:9292"        # sts API           -> /api/sts
      - "20600:13131"       # credentials API   -> /api/credentials
    #      - "8181:8181"        # default API       -> /api
    #      - "9999:9999"        # statuslist API    -> /statuslist
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
      - edc.hostname=consumer-idhub
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/cons_ih_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/logging.properties
    networks:
      - fx-test-network

  provider-idhub:
    container_name: provider-idhub
    image: identityhub-dev:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    ports:
      - "21000:80"          # did API           -> /
      - "21100:15151"       # identity API      -> /api/identity
      - "21500:9292"        # sts API           -> /api/sts
      - "21600:13131"       # credentials API   -> /api/credentials
    #      - "8181:8181"        # default API       -> /api
    #      - "9999:9999"        # statuslist API    -> /statuslist
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
      - edc.hostname=provider-idhub
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/prov_ih_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/logging.properties
    networks:
      - fx-test-network

  consumer-controlplane:
    container_name: consumer-controlplane
    image: edc-controlplane-postgresql-hashicorp-vault:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      # NB: the compose `entrypoint:` override drops the Dockerfile's
      # -javaagent flag, so the OTel agent must be re-added here. JAVA_TOOL_OPTIONS
      # is auto-applied by the JVM regardless of entrypoint.
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - edc.iam.trusted-issuer.example.id=did:web:local-issuer-service:fx-issuer
      - edc.iam.did.web.use.https=false
      - edc.iam.sts.oauth.client.secret.alias=consumersecret
      - edc.iam.credential.revocation.mimetype=application/json
      - edc.iam.sts.oauth.token.url=http://consumer-idhub:9292/api/sts/token
      - edc.iam.sts.oauth.client.id=did:web:consumer-idhub:user:consumer
      - edc.iam.issuer.id=did:web:consumer-idhub:user:consumer
      - web.http.port=9000
      - web.http.path=/api
      - web.http.management.port=9010
      - web.http.management.path=/management
      - web.http.protocol.port=9020
      - web.http.protocol.path=/dsp
      - web.http.validation.port=9030
      - web.http.validation.path=/validation
      - web.http.control.port=9050
      - web.http.control.path=/control
      - edc.hostname=consumer-controlplane
      - edc.participant.id=did:web:consumer-idhub:user:consumer
      - edc.dsp.callback.address=http://consumer-controlplane:9020/dsp
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/cons_cpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
      # OTel agent identity — distinguishes this runtime in metrics/traces.
      - OTEL_SERVICE_NAME=consumer-controlplane
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=fx-mvd,service.instance.id=consumer-controlplane
    volumes:
      - ./additional_config/logging.properties:/app/dataspaceconnector-configuration.properties
      # Activates the otherwise-inert OTel java-agent baked into the image.
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    healthcheck:
      # Readiness gates the data plane self-registration: the DP POST to
      # /control/v1/dataplanes 405s until the control API is mounted, so the data
      # planes depend_on this (avoids the "No dataplane found" startup race).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/api/check/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "29000:9000"  # Default port
      - "29010:9010"  # Management API
      - "29020:9020" # DSP API
    networks:
      - fx-test-network

  consumer-dataplane:
    container_name: consumer-dataplane
    image: edc-dataplane-hashicorp-vault:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      # NB: the compose `entrypoint:` override drops the Dockerfile's
      # -javaagent flag, so the OTel agent must be re-added here. JAVA_TOOL_OPTIONS
      # is auto-applied by the JVM regardless of entrypoint.
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - web.http.public.port=9500
      - web.http.public.path=/public
      - web.http.management.port=9510
      - web.http.management.path=/management
      - web.http.control.port=9550
      - web.http.control.path=/control
      - edc.hostname=consumer-dataplane
      - edc.dpf.selector.url=http://consumer-controlplane:9050/control/v1/dataplanes
      - edc.data.plane.self.unregistration=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/cons_dpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.transfer.proxy.token.signer.privatekey.alias=cons_priv
      - edc.transfer.proxy.token.verifier.publickey.alias=cons_pub
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
      - edc.iam.trusted-issuer.example.id=did:web:local-issuer-service:fx-issuer
      - edc.iam.did.web.use.https=false
      - edc.iam.sts.oauth.client.secret.alias=consumersecret
      - edc.iam.credential.revocation.mimetype=application/json
      - edc.iam.sts.oauth.token.url=http://consumer-idhub:9292/api/sts/token
      - edc.iam.sts.oauth.client.id=did:web:consumer-idhub:user:consumer
      - edc.iam.issuer.id=did:web:consumer-idhub:user:consumer
      # OTel agent identity — distinguishes this runtime in metrics/traces.
      - OTEL_SERVICE_NAME=consumer-dataplane
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=fx-mvd,service.instance.id=consumer-dataplane
    volumes:
      # Activates the otherwise-inert OTel java-agent baked into the image.
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
      consumer-controlplane:
        condition: service_healthy   # register only after the control API is up (no 405 race)
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "9600:9500" # Public API
    networks:
      - fx-test-network

  provider-controlplane:
    container_name: provider-controlplane
    image: edc-controlplane-postgresql-hashicorp-vault:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      # NB: the compose `entrypoint:` override drops the Dockerfile's
      # -javaagent flag, so the OTel agent must be re-added here. JAVA_TOOL_OPTIONS
      # is auto-applied by the JVM regardless of entrypoint.
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - edc.iam.trusted-issuer.example.id=did:web:local-issuer-service:fx-issuer
      - edc.iam.did.web.use.https=false
      - edc.iam.sts.oauth.client.secret.alias=providersecret
      - edc.iam.credential.revocation.mimetype=application/json
      - edc.iam.sts.oauth.token.url=http://provider-idhub:9292/api/sts/token
      - edc.iam.sts.oauth.client.id=did:web:provider-idhub:user:provider
      - edc.iam.issuer.id=did:web:provider-idhub:user:provider
      - web.http.port=9000
      - web.http.path=/api
      - web.http.management.port=9010
      - web.http.management.path=/management
      - web.http.protocol.port=9020
      - web.http.protocol.path=/dsp
      - web.http.validation.port=9030
      - web.http.validation.path=/validation
      - web.http.control.port=9050
      - web.http.control.path=/control
      - edc.hostname=provider-controlplane
      - edc.participant.id=did:web:provider-idhub:user:provider
      - edc.dsp.callback.address=http://provider-controlplane:9020/dsp
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/prov_cpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
      # OTel agent identity — distinguishes this runtime in metrics/traces.
      - OTEL_SERVICE_NAME=provider-controlplane
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=fx-mvd,service.instance.id=provider-controlplane
    volumes:
      - ./additional_config/logging.properties:/app/dataspaceconnector-configuration.properties
      # Activates the otherwise-inert OTel java-agent baked into the image.
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    healthcheck:
      # Readiness gates the data plane self-registration (see consumer-controlplane).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/api/check/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "39000:9000"  # Default port
      - "39010:9010"  # Management API
      - "39020:9020" # DSP API

    networks:
      - fx-test-network

  provider-dataplane:
    container_name: provider-dataplane
    image: edc-dataplane-hashicorp-vault:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      # NB: the compose `entrypoint:` override drops the Dockerfile's
      # -javaagent flag, so the OTel agent must be re-added here. JAVA_TOOL_OPTIONS
      # is auto-applied by the JVM regardless of entrypoint.
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - web.http.public.port=9500
      - web.http.public.path=/public
      - web.http.management.port=9510
      - web.http.management.path=/management
      - web.http.control.port=9550
      - web.http.control.path=/control
      - edc.hostname=provider-dataplane
      - edc.dpf.selector.url=http://provider-controlplane:9050/control/v1/dataplanes
      - edc.data.plane.self.unregistration=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/prov_dpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.transfer.proxy.token.signer.privatekey.alias=prov_priv
      - edc.transfer.proxy.token.verifier.publickey.alias=prov_pub
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
      - edc.iam.trusted-issuer.example.id=did:web:local-issuer-service:fx-issuer
      - edc.iam.did.web.use.https=false
      - edc.iam.sts.oauth.client.secret.alias=providersecret
      - edc.iam.credential.revocation.mimetype=application/json
      - edc.iam.sts.oauth.token.url=http://provider-idhub:9292/api/sts/token
      - edc.iam.sts.oauth.client.id=did:web:provider-idhub:user:provider
      - edc.iam.issuer.id=did:web:provider-idhub:user:provider
      # OTel agent identity — distinguishes this runtime in metrics/traces.
      - OTEL_SERVICE_NAME=provider-dataplane
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=fx-mvd,service.instance.id=provider-dataplane
    volumes:
      # Activates the otherwise-inert OTel java-agent baked into the image.
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties

    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
      provider-controlplane:
        condition: service_healthy   # register only after the control API is up (no 405 race)
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "9500:9500" # Public API
    networks:
      - fx-test-network
    # The data plane FETCHES the asset's baseUrl itself, so the payload-sweep
    # source (tools/gen-payloads.sh, served on the host) must resolve from inside
    # THIS container — not just from the k6 host. On Linux `host.docker.internal`
    # is not built in and has to be mapped explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # Monitoring stack
  # ---------------------------------------------------------------------------

  # Single OTLP sink for the EDC java-agents. Receives traces + metrics on 4317,
  # re-exposes metrics in Prometheus format on 8889 (scraped by Prometheus).
  # This is what turns the inert agents (Stage 2.1) into useful telemetry.
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.108.0
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC ingest
      - "8889:8889"   # Prometheus metrics endpoint
    networks:
      - fx-test-network
    restart: unless-stopped

  # Trace store. Receives spans from the collector and serves them to Grafana,
  # so a single negotiation/transfer can be followed across all four EDC
  # runtimes. Local-disk backend in a named volume.
  tempo:
    container_name: tempo
    image: grafana/tempo:2.6.0
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API (Grafana datasource queries this)
    networks:
      - fx-test-network
    restart: unless-stopped

  # Host-level CPU / memory / disk / network / filesystem.
  # Needed so we can tell a container spike apart from a host-side bottleneck
  # (e.g. swap, IO saturation) during Bruno / k6 runs.
  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # Exclude pseudo and container-overlay filesystems — otherwise the
      # "Filesystem" panels fill up with docker/overlay noise.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - fx-test-network
    restart: unless-stopped

  # Scrapes node-exporter + the OTel collector and stores time series. Scrape
  # interval is 5 s — tight enough to catch short negotiation/transfer spikes,
  # loose enough to avoid swamping a laptop.
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      # Accept k6's metric stream (--out experimental-prometheus-rw). Without this the
      # ONLY record of transaction success/failure is k6's end-of-run summary, so no
      # dashboard can show a workflow failure while it is happening.
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
      - otel-collector
    networks:
      - fx-test-network
    restart: unless-stopped

  # Grafana reads from Prometheus + Tempo (datasources provisioned at startup
  # from ./monitoring/grafana/provisioning).
  grafana:
    container_name: grafana
    image: grafana/grafana:11.2.0
    environment:
      # Dev credentials. Fine for a local benchmark rig; never use in shared
      # environments.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Skip the first-login password change prompt — keeps the file
      # reproducible for Bruno/k6 runs.
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Server-side PNG rendering for orchestration/export-panels.sh — turns the
      # per-arm screenshot chore into one command. Without these the /render
      # endpoint returns "Image renderer plugin not found".
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_LOG_FILTERS=rendering:debug
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON payloads referenced by provisioning/dashboards/dashboards.yaml.
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - fx-test-network
    restart: unless-stopped

  # Headless Chromium that renders dashboard panels to PNG. Only ever called by
  # Grafana itself, so it is not published on the host.
  grafana-renderer:
    container_name: grafana-renderer
    image: grafana/grafana-image-renderer:3.11.6
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - ENABLE_METRICS=false
      - RENDERING_MODE=default
    networks:
      - fx-test-network
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:

networks:
  fx-test-network:
    name: fx-test-network
    driver: bridge
