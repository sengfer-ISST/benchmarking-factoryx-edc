# Grafana datasource provisioning — applied on Grafana startup.
# Docs: https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
#
# Stage 1.3: single Prometheus datasource pointing at the overlay's
# `prometheus` service (DNS resolution happens over `fx-test-network`).
# Stage 2 will add a Tempo datasource here for traces.

apiVersion: 1

datasources:
  - name: Prometheus
    # Stable UID so provisioned dashboards can reference it explicitly if
    # needed (the cAdvisor dashboard references it by name "Prometheus",
    # which matches the `name` field above).
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Match prometheus.yml's scrape interval so Grafana's default step
      # matches real resolution — avoids misleading flat lines on fine ranges.
      timeInterval: 5s
