
# The collector is the single sink the agents push to; Prometheus then pulls
# from the collector. This pull/push split is why metrics need a 5 s agent
# export interval (opentelemetry.properties) AND a 5 s Prometheus scrape.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    timeout: 5s

exporters:
  # Re-exposes received metrics in Prometheus text format on :8889/metrics.
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep OTel resource attributes (service.name, service.instance.id) as
    # labels so Prometheus/Grafana can break metrics down per EDC runtime.
    resource_to_telemetry_conversion:
      enabled: true
  # Ship spans to Tempo over OTLP/gRPC (TLS off — internal network only).
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
